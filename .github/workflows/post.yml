name: Facebook auto-post

on:
  schedule:
    # Daily at 15:40 UTC = 8:40 PM Pakistan time. Add more lines for more posts/day.
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate only, do not post'
        type: boolean
        default: true
      post_type:
        description: 'auto = alternate photo/reel day by day'
        type: choice
        options: [auto, photo, reel]
        default: auto
      category:
        description: 'Override weekday category (blank = calendar)'
        type: choice
        options: ['', instagram-tags, tiktok-tags, youtube-tags, video-ideas, youtube-descriptions, seo-titles, trending-ideas, seo-checker, seo-blogs]
        default: ''
      platforms:
        description: 'Where to publish (pinterest = test Pinterest only, history untouched)'
        type: choice
        options: [all, facebook, pinterest]
        default: all
      pinterest_code:
        description: 'One-time Pinterest setup: paste the code (or full URL) after clicking Allow'
        type: string
        default: ''

permissions:
  contents: write   # to commit data/history.json back

concurrency:
  group: fb-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate and post
        run: npm start
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          POST_TYPE: ${{ inputs.post_type || vars.POST_TYPE || 'auto' }}
          MUSIC: ${{ vars.MUSIC || 'auto' }}
          CATEGORY: ${{ inputs.category }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          SEO_CHECKER_LIVE: ${{ vars.SEO_CHECKER_LIVE }}
          IMAGE_MODE: ${{ vars.IMAGE_MODE || 'template' }}
          POST_LANGUAGE: ${{ vars.POST_LANGUAGE || 'English' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_TOKEN_KEY: ${{ secrets.PINTEREST_TOKEN_KEY }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          PINTEREST_ENV: ${{ vars.PINTEREST_ENV || 'sandbox' }}
          PINTEREST_AUTH_CODE: ${{ inputs.pinterest_code }}
          PINTEREST_REDIRECT_URI: ${{ vars.PINTEREST_REDIRECT_URI }}
          PINTEREST_BOARD_NAME: ${{ vars.PINTEREST_BOARD_NAME }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      - name: Save post history
        if: success() || failure()
        run: |
          git config user.name "fb-agent-bot"
          git config user.email "fb-agent-bot@users.noreply.github.com"
          git add data/history.json $( [ -f data/pinterest-token.enc ] && echo data/pinterest-token.enc )
          git diff --staged --quiet || (git commit -m "chore: post history [skip ci]" && git pull --rebase -q && git push)
